visual: False
size: 640 #if not multiple of 32 it will be made to!

settings_for_uavtracker: ['herd_uavtrain', 'solitary_uavtrain']
settings_for_dbtracker_train: ['A', 'B' ,'C', 'D', 'E'] #training on single only
settings_for_dbtracker_test: ['solitary', 'group' , 'pack', 'herd',
'group_identical' , 'pack_identical', 'herd_identical']
# 'A_test_solitary', 'A_test_group' , 'A_test_pack', 'A_test_herd',
# 'B_test_solitary', 'B_test_group' , 'B_test_pack', 'B_test_herd'] #training on single only
datapoints_per_dbtracker_set_train: 500 #not all frames are suitable for providing the triples for the training
datapoints_per_dbtracker_set_test: 10000
param_seq_len: 25


solitary:
